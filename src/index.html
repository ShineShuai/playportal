<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enter the playground</title>
<meta name="description" content="A playground of small games. Catch the letters to find the way in.">
<meta name="theme-color" content="#f3f6ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0f2c" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='rgb(10,15,44)'/%3E%3Cpath d='M7 22 13 11 19 21 25 9' fill='none' stroke='rgb(255,180,84)' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="/theme.js"></script>
<script src="/lang.js"></script>
{{FONTS}}
<link rel="stylesheet" href="/portal.css">
</head>
<body>
<!--
  Games come from games.json (npm run build); every text is written twice, once per language:
      <span lang="en">English</span><span lang="zh">中文</span>
-->
<header>
  <div class="ctl">
    <button type="button" class="icon" data-toggle-theme aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>
      <span class="sr" lang="en">Dark mode</span><span class="sr" lang="zh">深色模式</span>
    </button>
    <div class="langs">
      <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-set-lang="zh" aria-pressed="false">中文</button>
    </div>
  </div>
</header>
<main>
  <h1><span lang="en">Enter the playground</span><span lang="zh">进入游乐场</span></h1>
  <p class="lead">
    <span lang="en">Catch the drifting letters. Spell a game’s name to open its door.</span>
    <span lang="zh">抓住飘动的字符，拼出游戏的名字，门就会打开。</span>
  </p>
  <p class="count"><span lang="en">Found <b class="found">0</b> of {{TOTAL}}</span><span lang="zh">已找到 <b class="found">0</b> / {{TOTAL}}</span></p>
  <ul class="games">
      {{TEASERS}}
  </ul>
  <noscript><p class="lead"><span lang="en">The games open with JavaScript turned on.</span><span lang="zh">需要开启 JavaScript 才能打开游戏。</span></p></noscript>
  <div class="bar" id="bar" hidden>
    <div id="shelf" hidden></div>
    <div class="row">
      <div id="slots" role="group"></div>
      <button type="button" id="clear"><span lang="en">Clear</span><span lang="zh">清空</span></button>
    </div>
  </div>
  <div class="tools" id="tools" hidden>
    <button type="button" id="pause" aria-pressed="false"><span lang="en">Pause letters</span><span lang="zh">暂停字符</span></button>
    <details id="typed">
      <summary><span lang="en">Know a name?</span><span lang="zh">知道名字？</span></summary>
      <label>
        <span class="sr" lang="en">Type a game name</span><span class="sr" lang="zh">输入游戏名字</span>
        <input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="24">
      </label>
    </details>
  </div>
  <div id="field"><svg id="trail" aria-hidden="true"></svg><div id="sky"></div></div>
</main>
<p class="sr" id="status" role="status" aria-live="polite"></p>
<script type="application/json" id="data">{{DATA}}</script>
<script type="module" src="/portal.js"></script>
</body>
</html>
