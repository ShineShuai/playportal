# Portal at https://play.vintoshine.com/ : static page plus a router for the games.
# Each game is its own Worker (own repo, own deploy) reached through a service binding.
# Per game: one [[services]] block, binding GAME_<SLUG>, and its paths in run_worker_first.
# `npm test` checks this file against portal.config.json. The custom domain is attached once in the
# dashboard (Worker -> Settings -> Domains & Routes): no `routes`, no zone permission needed.
name = "play-portal"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/zigzag", "/zigzag/*"]

[[services]]
binding = "GAME_ZIGZAG"
service = "zigzag-site"
